name: Publish to PyPI

# Publishes prime-metal when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# Uses PyPI Trusted Publishing, so no API token is stored in this repository.
# Configure it once at https://pypi.org/manage/account/publishing/ with
#   owner: xu-shi-jie   repository: prime   workflow: publish.yml   environment: pypi
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check the tag matches prime.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('prime/__init__.py').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "package $version / tag $tag"
          test "$version" = "$tag"

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - name: Smoke-test the wheel
        run: |
          pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP" && prime info && prime --version

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
